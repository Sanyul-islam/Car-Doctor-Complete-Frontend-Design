<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../style.css">
    <title>Sign Up</title>
</head>
<body>
    <nav id="navbar">
      <div class="container nav-container">
        <div class="logo"><a href="../../index.html"><img class="nav-logo" src="../../assets/logo.png" alt="Page logo" /></a></div>
        <div class="items-center mobile-menu">
          <ul class="nav-links">
            <li><a href="/">Order</a></li>
            <li><a href="#">Order Review</a></li>
            <li><a href="">Manage Inventory </a></li>
            <li><a href="./index.html">Login</a></li>
          </ul>
        </div>
      
    </nav>
    <main>
      <div id="singn-up">
        <div class="container grid-col-2">
          <div class="left-image items-center"></div>
          <div class="right-content">
            <div class="form-container">
              <h2 class="text-center">Login</h2>
              <form action="#">
                <div class="">
                  <label for="">Name</label><br>
                  <input type="text" placeholder="Your name">
                </div>
                <div class="">
                  <label for="">Email</label><br>
                  <input type="email" placeholder="Your Email">
                </div>
                <div class="">
                  <label >Password</label><br>
                  <input type="password" placeholder="Your Password">
                </div>
                
                <button>Login</button>
              </form>
              <div class="bottom-item items-center">
                <a>Or Sign In with</a>
                <div class="">
                  <ul class="flex">
                    <li><a href="#"><img src="../assets/Facebook(1).png" alt=""></a></li>
                    <li><a href="#"><img src="../assets/LinkedIn(2).png" alt=""></a></li>
                    <li><a href="#"><img src="../assets/Google.png" alt=""></a></li>
                  </ul>
                  
                </div>
                <p>Haven't an account? <span style="color: #FF3811;font-weight: 600;font-size: 1.12rem;"><a href="../sing-up/index.html">Sign In</a></span></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
